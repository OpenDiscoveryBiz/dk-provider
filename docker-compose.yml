x-tmpfs: &tmpfs
  - /tmp:mode=0770,uid=10001,gid=10001

services:
  dk-provider:
    build: .
    read_only: true
    privileged: false
    user: "10001:10001"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "18082:8000"
    environment:
      APP_URL: http://localhost:18082
      APP_KEY: ${APP_KEY:?php artisan key:generate}
      ERST_CVR_USER: ${ERST_CVR_USER:-}
      ERST_CVR_PASS: ${ERST_CVR_PASS:-}
      LOG_CHANNEL: stderr
      CACHE_STORE: array
      SESSION_DRIVER: array
      OCTANE_STATE_FILE: /tmp/octane-server-state.json
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp
      XDG_DATA_HOME: /tmp
    tmpfs: *tmpfs
    networks:
      - opendiscovery

# Created by root-provider compose; start that first.
networks:
  opendiscovery:
    name: opendiscovery
    external: true
