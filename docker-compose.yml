x-tmpfs: &tmpfs
  - /tmp:mode=1777,uid=10001,gid=10001
  - /data:mode=1777,uid=10001,gid=10001
  - /config:mode=1777,uid=10001,gid=10001
  - /app/storage:mode=1777,uid=10001,gid=10001
  - /app/bootstrap/cache:mode=1777,uid=10001,gid=10001

services:
  dk-provider:
    build: .
    read_only: true
    privileged: false
    user: "10001:10001"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "18082:8000"
    environment:
      APP_URL: http://localhost:18082
      APP_KEY: ${APP_KEY:?php artisan key:generate}
      ERST_CVR_USER: ${ERST_CVR_USER:-}
      ERST_CVR_PASS: ${ERST_CVR_PASS:-}
      LOG_CHANNEL: stderr
      OCTANE_STATE_FILE: /tmp/octane-server-state.json
    tmpfs: *tmpfs
    networks:
      - opendiscovery

# Created by root-provider compose; start that first.
networks:
  opendiscovery:
    name: opendiscovery
    external: true
